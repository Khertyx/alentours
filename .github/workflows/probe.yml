name: Sonde DATAtourisme
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sonder l'API
        env:
          DATATOURISME_KEY: ${{ secrets.DATATOURISME_KEY }}
        run: python3 tools/probe_datatourisme.py
